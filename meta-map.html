<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>経営のメタ視点マップ</title>
    
    <!-- React & ReactDOM（バージョン固定） -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    
    <!-- Babel（JSX変換 / v8はimportを自動挿入し白画面になるため7系最新に固定） -->
    <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
    
    <!-- Tailwind CSS（バージョン固定） -->
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>

    <style>
        /* スムーズスクロール用 */
        html {
            scroll-behavior: smooth;
        }
        /* タイトルまわり */
        .app-title {
            font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
            font-weight: 800;
            letter-spacing: 0.04em;
            font-feature-settings: "palt";
        }
        .app-title-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 9999px;
            background: linear-gradient(145deg, #1d4ed8, #0f3f83);
            color: white;
            box-shadow: 0 5px 14px rgba(30, 64, 175, 0.18);
            flex: 0 0 auto;
        }
        .app-title-logo {
            position: relative;
            overflow: hidden;
            border-radius: 11px;
            background: none;
        }
        .app-title-image {
            position: absolute;
            width: 240%;
            max-width: none;
            height: auto;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        .app-version {
            font-size: 0.34em;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #64748b;
            margin-left: 0.5rem;
            transform: translateY(0.2em);
            white-space: nowrap;
        }
        /* 操作ボタンの行を確保し、タイトルとの重なりを防ぐ */
        .app-header-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: flex-end;
            gap: 0.25rem;
            width: 100%;
            margin-bottom: 1rem;
        }
        .app-header-actions > button,
        .app-header-actions > label {
            flex: 0 0 auto;
            white-space: nowrap;
        }
        .app-title-text {
            min-width: 0;
            overflow-wrap: anywhere;
        }
        .app-title .app-version {
            display: inline-block;
            vertical-align: baseline;
        }
        @media (max-width: 639px) {
            .app-title { margin-bottom: 2rem; }
            .app-title-text { position: relative; }
            .app-title .app-version {
                position: absolute;
                top: 100%;
                right: 0;
                margin-left: 0;
            }
        }
        /* カスタムスクロールバー（オプション） */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* ビジネスモデルキャンバスの9ブロック配置。
           KP・VP・CS は上下2段抜き、KA/KR と CR/CH は上下に積み、
           最下段は コスト構造(左2列) と 収益の流れ(右3列)。
           ウィンドウ幅に依存しない指定にすることで、画面プレビュー・採寸・印刷が必ず一致する */
        /* 印刷レポートの表紙（1ページ目）。画面プレビューでも見えるよう通常CSSに置く */
        .cover-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 950px;
            padding: 40px 40px 30px;
            box-sizing: border-box;
        }
        .cover-titles { text-align: center; margin-top: 20px; }
        .cover-title { font-size: 32px; font-weight: 800; color: #1e293b; letter-spacing: 0.02em; }
        .cover-subtitle { font-size: 16px; font-weight: 700; color: #1B6FA8; margin-top: 8px; letter-spacing: 0.05em; }
        .cover-company { font-size: 19px; font-weight: 700; color: #1e293b; margin-top: 20px; }
        .cover-map { width: 100%; max-width: 460px; margin: 32px 0; }
        .cover-map svg { width: 100%; height: auto; display: block; }
        .cover-footer { margin-top: auto; text-align: center; padding-bottom: 8px; }
        .cover-office { font-size: 15px; font-weight: 700; color: #1e293b; }
        .cover-preparer { font-size: 14px; color: #1e293b; margin-top: 5px; }

        .bmc-canvas {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            grid-template-areas:
                "kp ka vp cr cs"
                "kp kr vp ch cs"
                "cost cost rev rev rev";
            gap: 6px;
        }
        .bmc-canvas > .bmc-kp   { grid-area: kp; }
        .bmc-canvas > .bmc-ka   { grid-area: ka; }
        .bmc-canvas > .bmc-kr   { grid-area: kr; }
        .bmc-canvas > .bmc-vp   { grid-area: vp; }
        .bmc-canvas > .bmc-cr   { grid-area: cr; }
        .bmc-canvas > .bmc-ch   { grid-area: ch; }
        .bmc-canvas > .bmc-cs   { grid-area: cs; }
        .bmc-canvas > .bmc-cost { grid-area: cost; }
        .bmc-canvas > .bmc-rev  { grid-area: rev; }

        /* 印刷時の版面条件を画面外で再現して
           BMCの高さを正確に採寸するための一時要素。@media printの外に置く必要がある。
           .bmc-landscape自体の幅は実際の印刷でも常にページ幅（1496px）になるため、
           ここで固定して測れば実際の印刷と一致する（.bmc-scale-innerの幅はCSSのcalc()で
           自動的にこの幅基準に追従するため、別途の指定は不要） */
        .bmc-measure {
            position: absolute !important;
            left: -99999px !important;
            top: 0 !important;
            width: 1496px !important;   /* A3横 420mm - 余白24mm = 396mm ≒ 1496px（96dpi換算） */
            height: auto !important;
            max-height: none !important;
            overflow: visible !important;
        }
        .bmc-measure .bmc-canvas {
            gap: 10px !important;
            font-size: 15px !important;
        }
        .bmc-measure .bmc-canvas > div {
            padding: 10px 13px !important;
            line-height: 1.6;
        }
        /* 印刷用レポート: 画面上は通常表示、印刷時はレポート領域だけを出力する */
        /* Screen-only: print reports retain their existing normal document flow. */
        @media screen {
            html.metamap-modal-locked { overflow: hidden !important; overscroll-behavior: none; }
            html.metamap-modal-locked body {
                position: fixed !important;
                top: var(--metamap-lock-top) !important;
                left: var(--metamap-lock-left) !important;
                width: 100% !important;
                box-sizing: border-box !important;
                padding-right: var(--metamap-lock-padding) !important;
                overflow: hidden !important;
            }
        }
        @media print {
            /* アプリ本体は領域ごと消す。visibility:hiddenだとレイアウト領域が残り、
               カード群の分だけ白紙ページが出力されてしまうため display:none を使う */
            #root { display: none !important; }
            .no-print { display: none !important; }

            /* レポートはbody直下のポータルから、通常フローで出力する */
            #print-portal .print-overlay {
                position: static !important;
                display: block !important;
                overflow: visible !important;
                background: none !important;
                padding: 0 !important;
            }
            #print-portal .print-sheet {
                max-width: none !important;
                width: 100% !important;
                margin: 0 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
            }
            #report-print-area {
                padding: 0 !important;
            }
            #report-print-area, #report-print-area * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            html, body {
                height: auto !important;
                overflow: visible !important;
                background: #fff !important;
            }
            @page { size: A4 portrait; margin: 14mm; }

            /* BMC（ビジネスモデルキャンバス）だけA3横で出力する。
               9つの箱を横に並べるため縦向きでは窮屈になるため。
               名前付きページはChrome/Edgeで有効。非対応ブラウザでは縦のまま出力される */
            @page bmcLandscape { size: A3 landscape; margin: 12mm; }
            #report-print-area .bmc-landscape {
                page: bmcLandscape;
                break-before: page;
                break-after: page;
            }
            /* 図（グリッド部分）だけを拡大縮小して用紙高さの約80%に収める。
               .bmc-landscape自体にzoomを掛けると、内側のCSS Grid(fr指定)の幅計算が
               ずれ、外枠の罫線は全幅なのに中身は半分の幅にしか描画されない不具合が
               確認されたため、標準的で挙動が予測できるtransform: scaleに変更した。
               scale-outerは高さを実測値に固定して版面上の占有スペースを確定させ、
               scale-innerは「scale後にscale-outerの幅と一致する幅」を
               calc(100% / zoom)で先に確保してからscaleするため、
               どのzoom値でも図が用紙の横幅いっぱいに描画される */
            #report-print-area .bmc-landscape .bmc-scale-outer {
                height: var(--bmc-h, auto);
                overflow: hidden;
            }
            #report-print-area .bmc-landscape .bmc-scale-inner {
                width: calc(100% / var(--bmc-zoom, 1));
                transform: scale(var(--bmc-zoom, 1));
                transform-origin: top left;
            }
            /* A3の余裕を活かし、余白・文字サイズを読みやすく（採寸クローンと完全一致させる必要がある） */
            #report-print-area .bmc-landscape .bmc-canvas {
                gap: 10px !important;
                font-size: 15px !important;
            }
            #report-print-area .bmc-landscape .bmc-canvas > div {
                padding: 10px 13px !important;
                line-height: 1.6;
            }

            /* 表紙は必ず1ページ目・単独ページにする */
            .cover-page {
                break-after: page;
                min-height: calc(297mm - 28mm);
                padding-top: 14mm;
            }
        }
    </style>
</head>

    "company":    ["自社に関する発見"],
    "ksf":        ["導出した成功要因"]
  }
}`,
            swot: `{
  "schemaVersion": "1.0", "framework": "swot", "subject": "{subject}",
  "analyzedAt": "YYYY-MM-DD", "summary": "クロスSWOT分析全体の要約を1〜2文",
  "data": {
    "strengths": ["強み"], "weaknesses": ["弱み"],
    "opportunities": ["機会"], "threats": ["脅威"],
    "cross": {
      "so": ["強み×機会の打ち手"], "wo": ["弱み×機会の打ち手"],
      "st": ["強み×脅威の打ち手"], "wt": ["弱み×脅威の打ち手"]
    }
  }
}`,
            strategy: `{
  "schemaVersion": "1.0", "framework": "strategy", "subject": "{subject}",
  "analyzedAt": "YYYY-MM-DD", "summary": "基本競争戦略の結論を1〜2文",
  "data": {
    "position":  "差別化",
    "rationale": "選定理由（1〜2文）",
    "actions":   ["具体アクション"]
  }
}`,
            bmc: `{
  "schemaVersion": "1.0", "framework": "bmc", "subject": "{subject}",
  "analyzedAt": "YYYY-MM-DD", "summary": "ビジネスモデル全体の要約を1〜2文",
  "data": {
    "kp": ["パートナー"], "ka": ["主要活動"], "kr": ["リソース"],
    "vp": ["価値提案"], "cr": ["顧客との関係"], "ch": ["チャネル"],
    "cs": ["顧客セグメント"], "cost": ["コスト構造"], "revenue": ["収益の流れ"]
  }
}`,
            '4p': `{
  "schemaVersion": "1.0", "framework": "4p", "subject": "{subject}",
  "analyzedAt": "YYYY-MM-DD", "summary": "4P分析全体の要約を1〜2文",
  "data": {
    "product":   ["製品・サービスの戦術"],
    "price":     ["価格の戦術"],
    "place":     ["流通・場所の戦術"],
    "promotion": ["販促・広告の戦術"]

}`,
            '7s': `{
  "schemaVersion": "1.0", "framework": "7s", "subject": "{subject}",
  "analyzedAt": "YYYY-MM-DD", "summary": "7S分析全体の要約を1〜2文",
  "data": {
    "strategy":     { "current": "現状", "issue": "課題" },
    "structure":    { "current": "現状", "issue": "課題" },
    "systems":      { "current": "現状", "issue": "課題" },
    "sharedValues": { "current": "現状", "issue": "課題" },
    "skills":       { "current": "現状", "issue": "課題" },
    "staff":        { "current": "現状", "issue": "課題" },
    "style":        { "current": "現状", "issue": "課題" },
    "alignment":    "整合性の総評（1〜2文）"

}`,
        };

        // 既存の分析結果から、後続分析へ引き継ぐ材料を箇条書きテキストに整形する。
        // 引き継ぎ元が増える（結果ビューを実装する）たびに、ここに1ブロック足すだけで
        // 後続プロンプトが自動的に充実する設計。
        function buildContextBlock(targetId, results) {
            if (targetId === 'kpi') {
                return ['pestel','5forces','3c','swot','strategy','bmc','4p','7s'].filter(id => results[id]).map(id =>
                    '■ ' + (ANALYSIS_META[id] || {}).name + '\n' + (results[id].summary || '') + '\n' + JSON.stringify(results[id].data || {}, null, 2)
                ).join('\n\n');
            }
            const lines = [];
            const pestel = results['pestel'];
            // PESTEL → 5forces / 3c / swot に機会・脅威を引き継ぐ
            if (pestel && ['5forces', '3c', 'swot'].includes(targetId)) {
                const picks = [];
                ['politics','economy','society','technology','environment','legal'].forEach(k => {
                    (pestel.data[k] || []).forEach(it => {
                        if (it && (it.type === '機会' || it.type === '脅威')) {
                            picks.push(`  ${it.type}: ${it.item}`);
                        }
                    });
                });
                if (pestel.summary) picks.unshift(`  総括: ${pestel.summary}`);
                if (picks.length) {
                    lines.push(`■ PESTEL分析（${pestel.analyzedAt || ''} 実施）の機会・脅威`);
                    lines.push(...picks);
                }
            }
            // 5フォース → 3c / swot に業界総評を引き継ぐ
            const forces = results['5forces'];
            if (forces && ['3c', 'swot'].includes(targetId)) {
                if (forces.data && forces.data.overall) {
                    lines.push(`■ 5フォース分析（${forces.analyzedAt || ''} 実施）の業界総評`);
                    lines.push(`  ${forces.data.overall}`);
                }
            }
            // 3C → swot に自社・顧客・競合・KSFを引き継ぐ
            const threec = results['3c'];
            if (threec && ['swot'].includes(targetId)) {
                const d = threec.data || {};
                const block = [];
                if (Array.isArray(d.company) && d.company.length)    block.push(`  自社: ${d.company.join(' / ')}`);
                if (Array.isArray(d.customer) && d.customer.length)  block.push(`  顧客: ${d.customer.join(' / ')}`);
                if (Array.isArray(d.competitor) && d.competitor.length) block.push(`  競合: ${d.competitor.join(' / ')}`);
                if (Array.isArray(d.ksf) && d.ksf.length)            block.push(`  KSF: ${d.ksf.join(' / ')}`);
                if (block.length) {
                    lines.push(`■ 3C分析（${threec.analyzedAt || ''} 実施）`);
                    lines.push(...block);
                }
            }
            // SWOT → strategy / bmc / 7s に強み・弱み・クロス戦略を引き継ぐ
            const swot = results['swot'];
            if (swot && ['strategy', 'bmc', '7s'].includes(targetId)) {
                const d = swot.data || {};
                const block = [];
                if (Array.isArray(d.strengths) && d.strengths.length)   block.push(`  強み: ${d.strengths.join(' / ')}`);
                if (Array.isArray(d.weaknesses) && d.weaknesses.length) block.push(`  弱み: ${d.weaknesses.join(' / ')}`);
                const c = d.cross || {};
                const crossPairs = [];
                if (Array.isArray(c.so) && c.so.length) crossPairs.push(`SO(積極): ${c.so.join(' / ')}`);
                if (Array.isArray(c.wo) && c.wo.length) crossPairs.push(`WO(改善): ${c.wo.join(' / ')}`);
                if (Array.isArray(c.st) && c.st.length) crossPairs.push(`ST(差別化): ${c.st.join(' / ')}`);
                if (Array.isArray(c.wt) && c.wt.length) crossPairs.push(`WT(防衛): ${c.wt.join(' / ')}`);
                crossPairs.forEach(cp => block.push(`  ${cp}`));
                if (block.length) {
                    lines.push(`■ クロスSWOT分析（${swot.analyzedAt || ''} 実施）`);
                    lines.push(...block);
                }
            }
            // 基本競争戦略 → bmc / 4p にポジションとアクションを引き継ぐ
            const strategy = results['strategy'];
            if (strategy && ['bmc', '4p'].includes(targetId)) {
                const d = strategy.data || {};
                const block = [];
                if (d.position) block.push(`  採用ポジション: ${d.position}`);
                if (d.rationale) block.push(`  理由: ${d.rationale}`);
                if (Array.isArray(d.actions) && d.actions.length) block.push(`  アクション: ${d.actions.join(' / ')}`);
                if (block.length) {
                    lines.push(`■ 基本競争戦略（${strategy.analyzedAt || ''} 実施）`);
                    lines.push(...block);
                }
            }
            // BMC → 4p に価値提案・チャネル・顧客セグメントを引き継ぐ
            const bmc = results['bmc'];
            if (bmc && ['4p'].includes(targetId)) {
                const d = bmc.data || {};
                const block = [];
                if (Array.isArray(d.vp) && d.vp.length) block.push(`  価値提案(VP): ${d.vp.join(' / ')}`);
                if (Array.isArray(d.cs) && d.cs.length) block.push(`  顧客セグメント(CS): ${d.cs.join(' / ')}`);
                if (Array.isArray(d.ch) && d.ch.length) block.push(`  チャネル(CH): ${d.ch.join(' / ')}`);
                if (Array.isArray(d.revenue) && d.revenue.length) block.push(`  収益の流れ: ${d.revenue.join(' / ')}`);
                if (block.length) {
                    lines.push(`■ ビジネスモデルキャンバス（${bmc.analyzedAt || ''} 実施）`);
                    lines.push(...block);
                }
            }
            // 4P → 7s にマーケティング施策を引き継ぐ（実行できる組織かを問う）
            const fourp = results['4p'];
            if (fourp && ['7s'].includes(targetId)) {
                const d = fourp.data || {};
                const block = [];
                if (Array.isArray(d.product) && d.product.length)     block.push(`  製品(Product): ${d.product.join(' / ')}`);
                if (Array.isArray(d.promotion) && d.promotion.length) block.push(`  販促(Promotion): ${d.promotion.join(' / ')}`);
                if (Array.isArray(d.place) && d.place.length)         block.push(`  流通(Place): ${d.place.join(' / ')}`);
                if (block.length) {
                    lines.push(`■ 4P分析（${fourp.analyzedAt || ''} 実施）`);
                    lines.push(...block);
                }
            }
            // ※ 後続分析（7s等）の結果ビュー実装時に、ここへ引き継ぎブロックを追加していく
            const extra = buildAdditionalContext(results);
            if (extra) lines.push(extra);
            return lines.join('\n');
        }

        // 分析用プロンプトを生成（基本情報＋引き継ぎ材料＋出力ルール＋スキーマ）
        function buildPrompt(analysisId, basicInfo, results) {
            const meta = ANALYSIS_META[analysisId] || { name: analysisId };
            const bi = basicInfo || EMPTY_BASIC;
            const infoLines = [];
            if (bi.subject)  infoLines.push(`会社名: ${bi.subject}`);
            if (bi.industry) infoLines.push(`業種: ${bi.industry}`);
            if (bi.location) infoLines.push(`所在地: ${bi.location}`);
            if (bi.size)     infoLines.push(`規模: ${bi.size}`);
            if (bi.business) infoLines.push(`事業内容: ${bi.business}`);
            if (bi.issues)   infoLines.push(`現状の課題: ${bi.issues}`);
            if (bi.memo)     infoLines.push(`補足メモ: ${bi.memo}`);

            const ctx = buildContextBlock(analysisId, results);
            const schema = (SCHEMA_EXAMPLES[analysisId] || '{}').replace(/\{subject\}/g, bi.subject || '（会社名）');

            let p = `以下の企業について${meta.name}を行います。対話形式で私に質問しながら分析を深めてください。\n\n`;
            p += `【基本情報】\n${infoLines.join('\n')}\n\n`;
            if (ctx) p += `【これまでの分析結果（参考にしてください）】\n${ctx}\n\n`;
            p += `【結果出力ルール】\n`;
            p += `分析がまとまった後、私が「JSON出力」と入力したら、結果を以下のJSON形式で出力してください。\n`;
            p += `- 出力はJSONオブジェクト1個のみ。前後に説明・見出し・補足を書かない\n`;
            p += `- 下記の項目をすべて含める。該当が無い項目も省略せず空配列[]または空文字""を入れる\n`;
            p += `- スキーマに無いキーを追加しない。キーは英語小文字、値は日本語\n`;
            p += `- "framework"は"${analysisId}"、"subject"は"${bi.subject || '（会社名）'}"\n`;
            p += `- "analyzedAt"は必ず "${todayStr()}" にする（これが今日の実際の日付。自分で日付を推測・生成しない）\n\n`;
            p += schema;
            return p;
        }

        // 課題解決イノベーター用プロンプト（集約対象外・全分析の要約を素材に他業種アイデアを引き出す）
        function buildInnovatorPrompt(basicInfo, results) {
            const bi = basicInfo || EMPTY_BASIC;
            const infoLines = [];
            if (bi.subject)  infoLines.push(`会社名: ${bi.subject}`);
            if (bi.industry) infoLines.push(`業種: ${bi.industry}`);
            if (bi.business) infoLines.push(`事業内容: ${bi.business}`);
            if (bi.issues)   infoLines.push(`現状の課題: ${bi.issues}`);

            // 取込済みの全分析から要約と主要な課題材料を集める
            const order = ['pestel','5forces','3c','swot','strategy','bmc','4p','7s'];
            const done = [];
            order.forEach(id => {
                const r = results[id];
                if (r && r.summary) done.push(`■ ${(ANALYSIS_META[id]||{}).name}: ${r.summary}`);
            });
            const extra = buildAdditionalContext(results);
            if (extra) done.push(extra);
            // SWOTの弱み・脅威があれば「解くべき課題」として明示
            const problems = [];
            const swot = results['swot'];
            if (swot && swot.data) {
                (swot.data.weaknesses || []).forEach(w => problems.push(`弱み: ${w}`));
                (swot.data.threats || []).forEach(t => problems.push(`脅威: ${t}`));
            }

            let p = `私の会社が抱える課題を、他業種の成功事例の仕組みを応用して解決する画期的なアイデアを一緒に考えてください。`;
            p += `対話形式で、視点を変える問いを投げかけながら発想を広げてください。\n\n`;
            p += `【基本情報】\n${infoLines.join('\n')}\n\n`;
            if (done.length) p += `【これまでの分析結果の要約】\n${done.join('\n')}\n\n`;
            if (problems.length) p += `【特に解決したい課題】\n${problems.join('\n')}\n\n`;
            p += `【進め方】\n`;
            p += `- まず、上記から「最も解く価値のある課題」を一緒に1つ絞り込んでください。\n`;
            p += `- その課題に対し、まったく異なる業種（例: 製造業の課題に飲食業やゲーム業界の仕組みを当てる等）の成功パターンを複数持ち出してください。\n`;
            p += `- それぞれを私の会社にどう応用できるか、具体的なアイデアに落として提案してください。\n`;
            return p;
        }


        // KPI / innovation: keep only the integration fields, never tree/chat/candidate data.
        function isLegacyKpiTree(obj) {
            return obj && typeof obj === 'object' && !Array.isArray(obj) && !obj.framework &&
                typeof obj.name === 'string' && typeof obj.operator === 'string' && Array.isArray(obj.children);
        }

        function convertLegacyKpiTree(tree) {
            let count = 0;
            const leaves = [];
            const metric = n => ({ id: n.id, name: n.name, baseValue: n.baseValue, currentValue: n.value, unit: n.unit });
            const walk = (n, depth) => {
                if (++count > 5000 || depth > 100 || !n || typeof n !== 'object' || Array.isArray(n) ||
                    typeof n.name !== 'string' || !n.name.trim() ||
                    (n.id != null && typeof n.id !== 'string') || (n.unit != null && typeof n.unit !== 'string') ||
                    !['leaf','multiply','sum','add'].includes(n.operator) || !Array.isArray(n.children) ||
                    !['value','baseValue'].every(k => typeof n[k] === 'number' && Number.isFinite(n[k])) ||
                    (n.operator === 'leaf' && n.children.length)) throw new Error('KPI V1ツリーの項目・数値・階層を確認してください。');
                if (n.children.length === 0 && depth > 0) leaves.push(metric(n));
                n.children.forEach(child => walk(child, depth + 1));
            };
            walk(tree, 0);
            return { schemaVersion: '1.0', framework: 'kpi', sourceFormat: 'kpi-tree-v1', subject: '', analyzedAt: '',
                summary: 'KPI V1の保存ツリーから取り込み。構成KPIは末端の入力項目です（重点KPIの選定情報はありません）。数値は保存時点の基準値と試算値です。',
                data: { goal: metric(tree), priorityKpis: leaves } };
        }

        function parseAdditionalResult(obj, expectedFramework) {
            if (isLegacyKpiTree(obj) && (!expectedFramework || expectedFramework === 'kpi')) {
                try { obj = convertLegacyKpiTree(obj); }
                catch (e) { return { ok: false, error: e.message }; }
            }
            const fail = error => ({ ok: false, error });
            const record = v => v && typeof v === 'object' && !Array.isArray(v);
            if (!record(obj) || !['kpi', 'innovation'].includes(obj.framework) ||
                (expectedFramework && obj.framework !== expectedFramework)) return fail('対応していない形式です');
            const d = obj.data;
            if (!record(d)) return fail('data項目がありません。');
            for (const key of ['subject', 'analyzedAt', 'summary']) {
                if (obj[key] != null && typeof obj[key] !== 'string') return fail(key + 'は文字列で指定してください。');
            }
            const pick = (item, keys) => Object.fromEntries(keys.filter(k => item[k] !== undefined).map(k => [k, item[k]]));
            const validFields = (item, texts, numbers = []) => record(item) &&
                texts.every(k => item[k] == null || typeof item[k] === 'string') &&
                numbers.every(k => item[k] == null || (typeof item[k] === 'number' && Number.isFinite(item[k])));
            let data;
            if (obj.framework === 'kpi') {
                if (!validFields(d.goal, ['name','unit'], ['baseValue','currentValue']) || !Array.isArray(d.priorityKpis) ||
                    !d.priorityKpis.every(k => validFields(k, ['id','name','unit'], ['baseValue','currentValue','impactPercent'])))
                    return fail('KPIのdata.goalとdata.priorityKpisの形式を確認してください。');
                data = {
                    goal: pick(d.goal, ['name','baseValue','currentValue','unit']),
                    priorityKpis: d.priorityKpis.map(k => pick(k, ['id','name','baseValue','currentValue','unit','impactPercent']))
                };
            } else {
                if (typeof d.problem !== 'string' || !d.problem.trim() ||
                    (d.abstractProblem != null && typeof d.abstractProblem !== 'string')) return fail('課題解決のdata.problemの形式を確認してください。');
                const ideas = d.selectedIdeas === undefined ? [] : d.selectedIdeas;
                const experiments = d.experiments === undefined ? [] : d.experiments;
                if (!Array.isArray(ideas) || !ideas.every(v => validFields(v, ['title','principle','sourceIndustry','expectedEffect'])) ||
                    !Array.isArray(experiments) || !experiments.every(v => validFields(v, ['ideaTitle','hypothesis','test','metric','successCondition'])))
                    return fail('selectedIdeasとexperimentsの形式を確認してください。');
                data = {
                    problem: d.problem, abstractProblem: d.abstractProblem || '',
                    selectedIdeas: ideas.map(v => pick(v, ['title','principle','sourceIndustry','expectedEffect'])),
                    experiments: experiments.map(v => pick(v, ['ideaTitle','hypothesis','test','metric','successCondition']))
                };
            }
            return { ok: true, value: { ...pick(obj, ['schemaVersion','framework','subject','analyzedAt','summary']), ...(obj.framework === 'kpi' && obj.sourceFormat === 'kpi-tree-v1' ? { sourceFormat: 'kpi-tree-v1' } : {}), data } };
        }

        function formatKpiValue(value, unit) {
            if (typeof value !== 'number' || !Number.isFinite(value)) return '';
            if (unit === '円' && Math.abs(value) >= 10000 && value % 10000 === 0)
                return (value / 10000).toLocaleString('ja-JP') + '万円';
            return value.toLocaleString('ja-JP', { maximumFractionDigits: 10 }) + (unit || '');
        }

        function additionalResultLines(result) {
            if (!result || !result.data) return [];
            const d = result.data, lines = [];
            if (result.framework === 'kpi') {
                const goal = d.goal || {};
                if (goal.name) lines.push('目標：' + goal.name);
                const values = [goal.baseValue, goal.currentValue].map(v => formatKpiValue(v, goal.unit)).filter(Boolean);
                if (values.length) lines.push(values.join(' → '));
                if ((d.priorityKpis || []).length) lines.push(result.sourceFormat === 'kpi-tree-v1' ? '構成KPI（V1入力項目）：' : '重点KPI：');
                (d.priorityKpis || []).forEach(k => {
                    if (k.name) lines.push('・' + k.name);
                    if (typeof k.impactPercent === 'number') lines.push('影響度：' + (k.impactPercent >= 0 ? '+' : '') + k.impactPercent + '%');
                });
            } else if (result.framework === 'innovation') {
                if (d.problem) lines.push('課題：' + d.problem);
                if (d.abstractProblem) lines.push('本質課題：' + d.abstractProblem);
                (d.selectedIdeas || []).forEach(v => {
                    if (v.title) lines.push('採用アイデア：' + v.title);
                    if (v.principle) lines.push('解決原理：' + v.principle);
                });
                (d.experiments || []).forEach(v => {
                    if (v.test) lines.push('実験：' + v.test);
                    if (v.metric) lines.push('確認KPI：' + v.metric);
                });
            }
            return lines;
        }

        // Standalone local infographics; imported text is always escaped.
        function buildInfographicHtml(result) {
            const checked = parseAdditionalResult(result);
            if (!checked.ok) throw new Error(checked.error);
            const r = checked.value, d = r.data;
            const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            const text = value => esc(value || '未設定');
            const legacy = r.sourceFormat === 'kpi-tree-v1';
            const title = r.framework === 'kpi' ? (legacy ? '売上要素分解の設計マップ' : '重点KPIの設計マップ') : '課題解決の実行マップ';
            const note = (label, value) => value ? `<p class="note"><b>${esc(label)}</b> ${esc(value)}</p>` : '';
            const empty = '<p class="empty">未設定</p>';
            const list = (items, render) => items.length ? items.map(render).join('') : empty;
            const step = (n, label, content) => `<section class="step"><div class="step-head"><span class="number">${n}</span><h2>${label}</h2></div>${content}</section>`;

                return { ok: false, error: 'JSONとして読み取れませんでした。テキストが正しくコピーされているか確認してください。' };

            if (!obj || typeof obj !== 'object') {

                return { ok: false, error: 'これは' + frameworkLabel + 'の結果ではありません（framework: ' + (obj.framework || '不明') + '）。' };
            }
            if (!obj.data || typeof obj.data !== 'object') {
                return { ok: false, error: 'data項目がありません。' };
            }
            return { ok: true, value: obj };

        function useModalScrollLock(active) {
            React.useLayoutEffect(() => {
                if (!active) return;
                const root = document.documentElement;
                const body = document.body;
                const x = window.scrollX, y = window.scrollY;
                const gap = Math.max(0, window.innerWidth - root.clientWidth);
                const padding = parseFloat(getComputedStyle(body).paddingRight) || 0;
                const values = {
                    '--metamap-lock-top': -y + 'px',
                    '--metamap-lock-left': -x + 'px',
                    '--metamap-lock-padding': (padding + gap) + 'px'
                };
                const previous = Object.keys(values).map(key => [key, root.style.getPropertyValue(key), root.style.getPropertyPriority(key)]);
                const hadClass = root.classList.contains('metamap-modal-locked');
                Object.entries(values).forEach(([key, value]) => root.style.setProperty(key, value));
                root.classList.add('metamap-modal-locked');
                return () => {
                    if (!hadClass) root.classList.remove('metamap-modal-locked');
                    previous.forEach(([key, value, priority]) => {
                        if (value) root.style.setProperty(key, value, priority);
                        else root.style.removeProperty(key);
                    });
                    window.scrollTo({ left: x, top: y, behavior: 'instant' });
                };
            }, [active]);

                        const loaded = (data && data.urls && typeof data.urls === 'object') ? data.urls : data;

                        const known = Object.keys(defaultUrls);

                    setTimeout(() => {

                        <span className="app-title-text">経営のメタ視点マップ<span className="app-version">Version.2</span></span>
                    </h1>
                    <p className="text-lg text-slate-600 mb-3">
                    環境分析から戦略実行までの全体フロー
                    </p>
                    <p className="text-sm text-blue-600 font-bold bg-white inline-block px-4 py-1.5 rounded-full shadow-sm border border-slate-200">
                        👆 各分析をクリックするとAIとの対話ができます／<span className="text-red-600">［プロンプト］</span>をコピーすると質問をAIが作成してくれます
                    </p>
                </header>

                {/* 基本情報カード */}
                <div className="max-w-3xl mx-auto mb-8">
                    {basicRegistered ? (
                        <div className="bg-blue-50 rounded-xl shadow-sm border border-blue-200 p-4 flex items-center justify-between gap-3">
                            <div className="min-w-0">
                                <div className="text-xs text-blue-500 font-bold mb-0.5">分析対象</div>
                                <div className="text-blue-900 font-bold truncate">{basicInfo.subject}</div>
                                <div className="text-xs text-blue-600 truncate">{[basicInfo.industry, basicInfo.business].filter(Boolean).join(' / ')}</div>
                            </div>
                            <button onClick={openBasic} className="shrink-0 px-4 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-colors text-sm">
                                基本情報を編集
                            </button>
                        </div>
                    ) : (
                        <button onClick={openBasic} className="w-full bg-red-50 border border-red-200 rounded-xl p-4 flex items-center justify-center gap-2 text-red-600 font-bold hover:bg-red-100 transition-colors text-sm">
                            <IconShieldAlert size={18} /> はじめに基本情報を登録してください
                        </button>
                    )}
                </div>

                <div className="max-w-5xl mx-auto">
                    
                    {/* PHASE 1: MACRO & INDUSTRY */}
                    {/* IDを追加: 状況把握のリンク先 */}
                    <div id="phase-analysis" className="relative mb-12 scroll-mt-8">
                    <div className="absolute left-1/2 -ml-0.5 w-0.5 h-full bg-slate-300 hidden md:block" aria-hidden="true"></div>
                    
                    {/* Step 1: PESTEL */}
                    <div className="relative flex flex-col items-center mb-12 group">
                        <div className="z-10 bg-blue-600 text-white px-6 py-2 rounded-full font-bold shadow-lg mb-4 flex items-center gap-2">
                        <IconGlobe size={20} />
                        Phase 1: 環境を知る（マクロ）
                        </div>
                        <div 
                        className="w-full max-w-3xl bg-white rounded-xl shadow-md border-l-8 border-blue-500 overflow-hidden hover:shadow-xl transition-shadow cursor-pointer transform hover:-translate-y-1 transition-all duration-200" 
                        onClick={() => { setPestelModal(pestelResult ? 'result' : 'menu'); setImportError(''); }}
                        title="クリックしてメニューを開く"
                        >
                        <div className="p-6">
                            <div className="flex justify-between items-center mb-2">
                            <h2 className="text-2xl font-bold text-blue-800 flex items-center gap-2">
                                PESTEL分析
                                <span className="text-xs font-normal text-blue-400 border border-blue-200 rounded px-1">Click to Open</span>
                            </h2>
                            <div className="flex items-center gap-2">
                                {pestelResult ? (
                                    <span className="text-xs font-bold bg-emerald-100 text-emerald-700 px-2 py-1 rounded">✓ 取込済 {String(pestelResult.analyzedAt || '').slice(5).replace('-', '/')}</span>
                                ) : (
                                    <span className="text-xs font-bold bg-slate-100 text-slate-400 px-2 py-1 rounded">未取込</span>
                                )}
                                <span className="text-xs font-semibold bg-blue-100 text-blue-800 px-2 py-1 rounded">世の中のトレンド</span>
                            </div>
                            </div>
                            <p className="text-slate-600 mb-4">自社ではコントロールできない「世の中の大きな変化」を分析する</p>
                            <div className="mb-3"><PromptButton onClick={() => openPrompt('pestel')} /></div>
                            <div className="grid grid-cols-2 md:grid-cols-6 gap-2 text-center text-sm font-semibold text-slate-700">
                            <div className="bg-slate-100 p-2 rounded">P:政治</div>
                            <div className="bg-slate-100 p-2 rounded">E:経済</div>
                            <div className="bg-slate-100 p-2 rounded">S:社会</div>
                            <div className="bg-slate-100 p-2 rounded">T:技術</div>
                            <div className="bg-slate-100 p-2 rounded">E:環境</div>
                            <div className="bg-slate-100 p-2 rounded">L:法律</div>
                            </div>
                            {pestelResult && pestelResult.summary && (
                                <p className="text-xs text-slate-500 mt-3 border-t border-slate-100 pt-2 line-clamp-2">{pestelResult.summary}</p>
                            )}
                        </div>
                        </div>
                    </div>

                    {/* Step 2: 5 Forces */}
                    <div className="relative flex flex-col items-center mb-12">
                        <div 
                        className="w-full max-w-3xl bg-white rounded-xl shadow-md border-l-8 border-indigo-500 overflow-hidden hover:shadow-xl transition-shadow cursor-pointer transform hover:-translate-y-1 transition-all duration-200" 
                        onClick={() => { setForcesModal(forcesResult ? 'result' : 'menu'); setForcesError(''); }}
                        title="クリックしてメニューを開く"
                        >
                        <div className="p-6">
                            <div className="flex justify-between items-center mb-2">
                            <h2 className="text-2xl font-bold text-indigo-800 flex items-center gap-2">
                                5フォース分析
                                <span className="text-xs font-normal text-indigo-400 border border-indigo-200 rounded px-1">Click to Open</span>
                            </h2>
                            <div className="flex items-center gap-2">
                                {forcesResult ? (
                                    <span className="text-xs font-bold bg-emerald-100 text-emerald-700 px-2 py-1 rounded">✓ 取込済 {String(forcesResult.analyzedAt || '').slice(5).replace('-', '/')}</span>
                                ) : (
                                    <span className="text-xs font-bold bg-slate-100 text-slate-400 px-2 py-1 rounded">未取込</span>
                                )}
                                <span className="text-xs font-semibold bg-indigo-100 text-indigo-800 px-2 py-1 rounded">業界の収益性</span>
                            </div>
                            </div>
                            <p className="text-slate-600 mb-4">その業界は儲かるか？敵はどこにいるか？（業界の脅威）</p>
                            <div className="mb-3"><PromptButton onClick={() => openPrompt('5forces')} /></div>
                            <div className="flex flex-wrap justify-center gap-3">
                            <span className="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-sm border border-indigo-200">競合他社</span>
                            <span className="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-sm border border-indigo-200">新規参入</span>
                            <span className="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-sm border border-indigo-200">代替品</span>
                            <span className="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-sm border border-indigo-200">買い手の力</span>
                            <span className="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-sm border border-indigo-200">売り手の力</span>
                            </div>
                            {forcesResult && forcesResult.summary && (
                                <p className="text-xs text-slate-500 mt-3 border-t border-slate-100 pt-2 line-clamp-2">{forcesResult.summary}</p>
                            )}
                        </div>
                        </div>
                    </div>

                    </div>

                    {/* PHASE 2: STRATEGY */}
                    {/* IDを追加: 戦略立案のリンク先 */}
                    <div id="phase-strategy" className="relative mb-12 scroll-mt-8">

                                                        {d.cross && (

                                                                {[['so','SO：積極化'],['wo','WO：改善'],['st','ST：差別化'],['wt','WT：防衛']].map(([k,label]) => (
                                                                    (d.cross[k]||[]).length > 0 && (
                                                                        <div key={k} className="bg-slate-50 rounded-lg p-2">
                                                                            <div className="text-[10px] font-bold text-slate-500 mb-1">{label}</div>
                                                                            <div className="text-xs text-slate-700">{d.cross[k].join(' / ')}</div>
                                                                        </div>

                                                {id === 'strategy' && (
                                                    <div>

                                                            採用ポジション: {d.position || '—'}
                                                        </span>
                                                        {d.rationale && <p className="text-xs text-slate-600 mb-2">{d.rationale}</p>}
                                                        {(d.actions||[]).length > 0 && (
                                                            <ul className="space-y-1">
                                                                {d.actions.map((a,i) => (
                                                                    <li key={i} className="text-xs text-slate-700 flex items-start gap-1.5">
                                                                        <span className="w-4 h-4 bg-cyan-50 text-cyan-600 rounded-full text-[9px] font-bold flex items-center justify-center shrink-0 mt-0.5">{i+1}</span>

                                                            ['kr','リソース','KR','bmc-kr','bg-slate-50','text-slate-400'],
                                                            ['vp','価値提案','VP','bmc-vp','bg-violet-50','text-violet-500'],
                                                            ['cr','関係','CR','bmc-cr','bg-slate-50','text-slate-400'],
                                                            ['ch','チャネル','CH','bmc-ch','bg-slate-50','text-slate-400'],
                                                            ['cs','顧客','CS','bmc-cs','bg-slate-50','text-slate-400'],
                                                            ['cost','コスト構造','C$','bmc-cost','bg-slate-50','text-slate-400'],
                                                            ['revenue','収益の流れ','R$','bmc-rev','bg-emerald-50','text-emerald-500']
                                                        ].map(([k,l,abbr,area,bg,fg]) => (

                                                {id === '7s' && (

                    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-emerald-600 text-white px-5 py-2.5 rounded-full shadow-lg text-sm font-bold flex items-center gap-2">
                        <span>✓</span> {toast}

        };

        // BMC（ビジネスモデルキャンバス）をA4横1ページに収めるための自動縮小。
        // 内容量は分析結果によって変わるため、印刷直前に実寸を測って縮小率を決める。
        // A4横: 297×210mm。余白24mmを引いた版面は約1032×703pxだが、ブラウザの
        // ヘッダー・フッター表示などで実際に使える高さは減るため、安全側に見積もる。
        const fitBmcForPrint = () => {
            const sec = document.querySelector('#report-print-area .bmc-landscape');
            if (!sec) return;
            const cloneCheck = sec.querySelector('.bmc-scale-inner');
            if (!cloneCheck) return;
            const TARGET_H = 826;   // A3横の版面高1032px(297mm-余白24mm)の約80%
            const MIN_ZOOM = 0.4;   // これ以上は文字が読みにくくなるため下限
            const MAX_ZOOM = 1.8;   // 内容が少ない場合でも文字が異常に大きくならないための上限

            // 印刷時と全く同じ条件（幅補正＋scale）を画面外のクローンで再現し、
            // 候補のzoom値ごとに実測しながら目標高に収束させる。
            // 以前は「zoom=1相当の高さを1回だけ測って比例計算する」方式だったが、
            // 測定時は幅100%固定・印刷時は幅100%/zoomで、内容によっては折り返し方が
            // 変わってしまい誤差が生じ、実際の分析結果で下段（コスト構造・収益の流れ）が
            // overflow:hiddenで切れる事故が起きた。ここでは印刷と全く同じ計算式を
            // 候補ごとにinline styleで直接適用して測ることで、この誤差を無くす
            // （.bmc-scale-innerのCSSは@media print内にしかないため、画面上のクローンには
            // 効かず、inline style指定が必須）
            const clone = sec.cloneNode(true);
            clone.classList.add('bmc-measure');
            document.body.appendChild(clone);
            clone.querySelectorAll('.no-print').forEach(el => el.remove());
            const cloneInner = clone.querySelector('.bmc-scale-inner');
            cloneInner.style.setProperty('transform-origin', 'top left');

            const measureAt = (z) => {
                cloneInner.style.setProperty('width', (100 / z) + '%');
                cloneInner.style.setProperty('transform', 'scale(' + z + ')');
                return cloneInner.getBoundingClientRect().height;
            };

            let zoom = 1;
            let h = measureAt(zoom);
            // 上限・下限にクランプされた候補値でも、そこでの実測を経ずに確定してはいけない
            // （例: 1回目の推定でMAX_ZOOMに張り付いた場合、そのzoomで測ると実際には
            // 幅が狭くなって折り返しが増え、高さが目標を大きく超えることがある。
            // それに気づかず確定すると、内容が2ページに溢れる事故につながる。
            // そのためbreakは「その場所で実測した結果が目標に十分近いか」だけで判定し、
            // 上限・下限に達したこと自体では止めない）
            for (let i = 0; i < 25 && h > 0; i++) {
                // 幅がzoomに反比例して変わる(100%/zoom)ため、高さはおおよそzoomの2乗で
                // 変化する。単純な比率(target/h)で補正すると行き過ぎて振動し
                // 収束しないため、平方根を使って補正する
                const nextZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * Math.sqrt(TARGET_H / h)));
                if (Math.abs(nextZoom - zoom) < 0.001) break;
                zoom = nextZoom;
                h = measureAt(zoom);
                if (Math.abs(h - TARGET_H) <= 4) break;
            }
            clone.remove();

            const z = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, Math.round(zoom * 1000) / 1000));
            sec.style.setProperty('--bmc-zoom', String(z));
            // 実測した高さに余裕を足して外枠を固定する（ぎりぎりで最終行が欠けるのを防ぐ）
            sec.style.setProperty('--bmc-h', (Math.ceil(h) + 14) + 'px');
        };




        // ブラウザの印刷メニュー（Ctrl+P）から印刷された場合にも適用する
        window.addEventListener('beforeprint', fitBmcForPrint);

        // 白画面の代わりに原因を表示するエラーバウンダリ
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { error: null }; }
            static getDerivedStateFromError(error) { return { error }; }
            componentDidCatch(error, info) { console.error('描画エラー:', error, info); }
            render() {
                if (this.state.error) {
                    return (
                        <div style={{ padding: 20, fontFamily: 'sans-serif', color: '#b91c1c' }}>
                            <h2>エラーが発生しました</h2>
                            <pre style={{ whiteSpace: 'pre-wrap' }}>{String(this.state.error)}</pre>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><FrameworkInfographic /></ErrorBoundary>);
    </script>
